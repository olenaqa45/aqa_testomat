name: API Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Verify secrets are set
        env:
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$BASE_APP_URL" ]; then echo "ERROR: BASE_APP_URL is empty"; exit 1; fi
          if [ -z "$API_TOKEN" ]; then echo "ERROR: API_TOKEN is empty"; exit 1; fi
          echo "Secrets loaded OK (${#BASE_APP_URL} chars, starts with ${BASE_APP_URL:0:8})"

      - name: Run API tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CI: "true"
        run: uv run pytest tests/api/ -m "api" --timeout=30 --ignore=tests/web/selenium

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: test-result/report.html
          retention-days: 7
