name: CI smoke test
# =============================================================================
# CI/CD Pipeline for aqa-testomat
# =============================================================================
# This pipeline runs automatically on every push and pull request.
# It ensures code quality (lint) and catches bugs early before merging.
#
# Pipeline structure:
#   1. lint   — checks code formatting and style rules
#   2. test   — runs the smoke tests
#   3. report — publishes Allure report to GitHub Pages
# =============================================================================



# ─── TRIGGERS ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, develop, MNFCT-* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

# ─── JOBS ────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Check formatting
        run: uv run ruff format --check --diff

      - name: Run linter
        run: uv run ruff check

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: SMOKE TEST
  # ═══════════════════════════════════════════════════════════════════════════
  smoke-test:
    runs-on: ubuntu-latest
    if: >
      always() && !failure() && (
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.test_suite == 'smoke' || inputs.test_suite == 'all'))
      )
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CI: "true"
        run: uv run pytest -m smoke

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-allure-results
          path: test-result/allure-results/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-result/traces/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: REGRESSION TEST
  # ═══════════════════════════════════════════════════════════════════════════
  regression-test:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: >
      success() && (
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.test_suite == 'regression' || inputs.test_suite == 'all'))
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run regression tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CI: "true"
        run: uv run pytest -m regression --ignore=tests/web/selenium

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-allure-results
          path: test-result/allure-results/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-traces
          path: test-result/traces/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: PUBLISH ALLURE REPORT
  # ═══════════════════════════════════════════════════════════════════════════
  publish-report:
    runs-on: ubuntu-latest
    needs: [smoke-test, regression-test]
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz | tar -xz
          echo "$PWD/allure-2.32.0/bin" >> "$GITHUB_PATH"

      - name: Download smoke allure results
        uses: actions/download-artifact@v4
        with:
          name: smoke-allure-results
          path: allure-results/
        continue-on-error: true

      - name: Download regression allure results
        uses: actions/download-artifact@v4
        with:
          name: regression-allure-results
          path: allure-results/
        continue-on-error: true

      - name: Download previous report history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history/
        continue-on-error: true

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Save history for next run
        uses: actions/upload-artifact@v7
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 30
          overwrite: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
