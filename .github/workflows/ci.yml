name: CI smoke test
# =============================================================================
# CI/CD Pipeline for aqa-testomat
# =============================================================================
# This pipeline runs automatically on every push and pull request.
# It ensures code quality (lint) and catches bugs early before merging.
#
# Pipeline structure:
#   1. lint   — checks code formatting and style rules
#   2. test   — runs the smoke tests
# =============================================================================



# ─── TRIGGERS ────────────────────────────────────────────────────────────────
# "on" defines WHEN this pipeline will run.
# - push: runs when code is pushed to main or develop branches
# - pull_request: runs when someone opens/updates a PR targeting main
on:
  push:
    branches: [ main, develop, MNFCT-* ]
  pull_request:
    branches: [ main ]
  # ── workflow_dispatch ────────────────────────────────────────────────────
  # Allows you to run this pipeline MANUALLY from the GitHub UI at any time.
  # Go to Actions tab > select "CI" workflow > click "Run workflow" button.
  # Useful when:
  #   - You want to re-run tests without pushing a new commit
  #   - You need to verify the pipeline after adding/changing secrets
  #   - You want to trigger tests on a specific branch on demand
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

# ─── ENVIRONMENT ─────────────────────────────────────────────────────────────
# Force all JavaScript-based actions to run on Node.js 24 (removes deprecation warning).
# ─── JOBS ────────────────────────────────────────────────────────────────────
# Jobs run in parallel by default. Each job gets a fresh virtual machine.
# We use "needs" to make one job wait for another (dependency chain).
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT
  # ═══════════════════════════════════════════════════════════════════════════
  # Purpose: Catch formatting issues, unused imports, and code style violations
  # BEFORE running any tests. This is fast (~10s) and saves CI minutes by
  # failing early if the code doesn't meet standards.
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      # ── Step: Validate GitHub Actions workflows ────────────────────────────
      # actionlint checks .github/workflows/*.yml for syntax errors,
      # invalid expressions (like = instead of ==), unknown action inputs,
      # and type mismatches. Catches CI bugs before they run.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      # ── Step: Run Ruff format check ────────────────────────────────────────
      # Ruff is the linter/formatter configured in pyproject.toml.
      # "ruff format --check" verifies all files are properly formatted
      # WITHOUT modifying them. If any file differs from expected format,
      # the step fails and shows which files need formatting.
      # --diff shows exactly what lines are wrong so you can fix them.
      - name: Check formatting
        run: uv run ruff format --check --diff

      # ── Step 4: Run Ruff linter ────────────────────────────────────────────
      # "ruff check" runs static analysis rules defined in pyproject.toml:
      #   E/W = pycodestyle errors/warnings
      #   F   = pyflakes (unused imports, undefined names)
      #   I   = isort (import ordering)
      #   B   = bugbear (common bugs)
      #   UP  = pyupgrade (use modern Python syntax)
      #   SIM = simplify (unnecessarily complex code)
      # If any rule is violated, the step fails with file:line:column detail.
      - name: Run linter
        run: uv run ruff check

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: SMOKE TEST
  # ═══════════════════════════════════════════════════════════════════════════
  # Purpose: Run the smoke test suite to verify critical paths work.
  # "needs: lint" means this job ONLY starts after lint passes — no point
  # running slow tests if the code doesn't even pass basic style checks.
  smoke-test:
    runs-on: ubuntu-latest
    if: >
      always() && !failure() && (
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.test_suite == 'smoke' || inputs.test_suite == 'all'))
      )
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      # ── Step: Install Playwright browsers ──────────────────────────────────
      # Playwright needs actual browser binaries (Chromium, Firefox, WebKit)
      # downloaded to the runner. This step fetches them.
      # --with-deps also installs OS-level libraries (libglib, libnss, etc.)
      # that browsers need on headless Linux.
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      # ── Step: Run tests ────────────────────────────────────────────────────
      # Runs pytest with the smoke marker to select only critical-path tests.
      # --ignore=tests/web/selenium excludes Selenium tests (no chromedriver in CI).
      #
      # Environment variables are injected from GitHub Secrets — these are
      # encrypted values you configure in Settings > Secrets > Actions.
      # They are NEVER printed in logs.
      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CI: "true"
        run: uv run pytest -m smoke

      # ── Step: Upload test report ───────────────────────────────────────────
      # Uploads the HTML report as a downloadable artifact.
      # You can find it in the Actions tab > job run > "Artifacts" section.
      # "if: always()" means this runs even on failure.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: |
            test-result/report.html
            test-result/assets/
          retention-days: 7

      # ── Step: Upload Playwright traces ─────────────────────────────────────
      # Traces are recorded during test execution (screenshots, DOM snapshots,
      # network logs, action timeline). When a test fails, the trace .zip is
      # saved to test-result/traces/. You can open it at https://trace.playwright.dev
      # to replay the test step-by-step and see exactly what went wrong.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-result/traces/
          retention-days: 7

  regression-test:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: >
      success() && (
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.test_suite == 'regression' || inputs.test_suite == 'all'))
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run regression tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CI: "true"
        run: uv run pytest -m regression --ignore=tests/web/selenium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-test-results
          path: |
            test-result/report.html
            test-result/assets/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-traces
          path: test-result/traces/
          retention-days: 7

  publish-report:
    runs-on: ubuntu-latest
    needs: [smoke-test, regression-test]
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download smoke HTML report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-results
          path: pages/smoke/
        continue-on-error: true

      - name: Download regression HTML report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          path: pages/regression/
        continue-on-error: true

      - name: Prepare pages structure
        run: |
          # Move files from test-result/ subfolder to root of each report dir
          if [ -d pages/smoke/test-result ]; then
            mv pages/smoke/test-result/* pages/smoke/
            rm -rf pages/smoke/test-result
          fi
          if [ -d pages/regression/test-result ]; then
            mv pages/regression/test-result/* pages/regression/
            rm -rf pages/regression/test-result
          fi

      - name: Prepare index page
        run: |
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>Test Reports</title></head>
          <body>
            <h1>Test Reports</h1>
            <ul>
              <li><a href="smoke/report.html">Smoke Test Report</a></li>
              <li><a href="regression/report.html">Regression Test Report</a></li>
            </ul>
          </body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
