# Composite action that encapsulates the common setup steps
# reused across all workflows (ci.yml, api.yml, etc.)
# Usage in a workflow:
#   - uses: ./.github/actions/setup

name: Setup Python & Dependencies
description: Install uv, Python, and project dependencies

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install 3.14

    - name: Install dependencies
      shell: bash
      run: uv sync
